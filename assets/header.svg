<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">小宇 Mono</title>
  <desc id="desc">把软件想法，一步步做出来。从想法到上线，一人全程负责。</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#031126"/>
      <stop offset="1" stop-color="#061D35"/>
    </linearGradient>
    <linearGradient id="shell" x1="105" y1="95" x2="355" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1EAE0"/>
      <stop offset="1" stop-color="#CFC4B5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00CADA" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <path d="M826 -80C988 6 1030 118 1226 102" stroke="#00CADA" stroke-opacity="0.13" stroke-width="90"/>
  <circle cx="1102" cy="352" r="170" fill="#F67C33" fill-opacity="0.055"/>

  <g transform="translate(70 42)">
    <rect x="25" y="34" width="290" height="294" rx="62" fill="#000000" fill-opacity="0.26"/>
    <rect x="15" y="24" width="290" height="294" rx="62" fill="url(#shell)"/>
    <rect x="41" y="51" width="238" height="184" rx="35" fill="#010910"/>
    <rect x="49" y="59" width="222" height="168" rx="29" stroke="#00CADA" stroke-opacity="0.17" stroke-width="2"/>
    <rect x="91" y="112" width="38" height="38" rx="9" fill="#00CADA" filter="url(#glow)"/>
    <rect x="191" y="112" width="38" height="38" rx="9" fill="#00CADA" filter="url(#glow)"/>
    <rect x="92" y="169" width="94" height="12" rx="6" fill="#00CADA" fill-opacity="0.62"/>
    <rect x="198" y="169" width="27" height="12" rx="3" fill="#F67C33" filter="url(#glow)"/>
    <circle cx="255" cy="274" r="17" fill="#031126"/>
    <circle cx="255" cy="274" r="7" fill="#F67C33"/>
    <rect x="65" y="265" width="116" height="15" rx="7.5" fill="#031126" fill-opacity="0.18"/>
    <rect x="64" y="292" width="79" height="8" rx="4" fill="#031126" fill-opacity="0.13"/>
  </g>

  <g transform="translate(430 92)">
    <rect width="60" height="7" rx="3.5" fill="#F67C33"/>
    <text x="0" y="86" fill="#E6DED2" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="68" font-weight="700" letter-spacing="-2">小宇 Mono</text>
    <text x="0" y="143" fill="#00CADA" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="31" font-weight="600">把软件想法，一步步做出来</text>
    <text x="0" y="195" fill="#E6DED2" fill-opacity="0.78" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">从想法到上线，一人全程负责</text>
    <text x="0" y="253" fill="#E6DED2" fill-opacity="0.46" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="2">DESIGN  ·  DEVELOP  ·  TEST  ·  DEPLOY</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="29" stroke="#E6DED2" stroke-opacity="0.08" stroke-width="2"/>
</svg>
